<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Grid</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    
</head>

<body>

    <main class="dashboard">

        <aside class="sidebar">
            Sidebar
        </aside>

        <section class="card revenue">
            Revenue
        </section>

        <section class="card deals">
            Lost Deals
        </section>

        <section class="card goal">
            Goal
        </section>

        <section class="card customers">
            Customers
        </section>

        <section class="growth">

            <div class="growth-chart">
                Chart
            </div>

            <div class="growth-month">
                Month
            </div>

            <div class="growth-year">
                Year
            </div>

            <div class="growth-buyer">
                Buyer
            </div>

        </section>

        <section class="card chats">
            Chats
        </section>

        <section class="card states">
            Top States
        </section>

        <section class="card new-deals">
            New Deals
        </section>

    </main>

</body>

</html>
